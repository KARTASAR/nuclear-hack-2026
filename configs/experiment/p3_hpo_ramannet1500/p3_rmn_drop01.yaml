data:
  allowed_classes:
  - control
  - endo
  - exo
  exclude_anomaly_mismatch_center: true
  exclude_average: true
  point_max_per_file: 8
  require_all_classes: true
  root_dir: data/real
  strict_filename_match: false
  center: '1500'
  sample_level: file_mean
experiment:
  output_root: runs
  seed: 42
  name: p3_rmn_drop01
model:
  model_family: ramannet
  torch_epochs: 25
  torch_batch_size: 32
  torch_lr: 0.001
  torch_weight_decay: 0.0003
  torch_patience: 5
  torch_device: auto
  ramannet_segments: 64
  ramannet_embed_dim: 64
  ramannet_dropout: 0.1
preprocess:
  baseline_lam: 100000.0
  baseline_method: arpls
  baseline_niter: 12
  baseline_p: 0.01
  normalization: msc
  savgol_poly: 3
  savgol_window: 11
  wn_max: 1998.0
  wn_min: 930.0
validation:
  n_splits: 5
  split_kind: stratified_group_kfold
  split_shuffle: true
  split_seed: 42
  local_holdout_groups: []
