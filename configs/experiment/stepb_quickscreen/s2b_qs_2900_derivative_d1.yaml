data:
  allowed_classes:
  - control
  - endo
  - exo
  center: '2900'
  exclude_anomaly_mismatch_center: true
  exclude_average: true
  point_max_per_file: 8
  require_all_classes: true
  root_dir: data/real
  sample_level: file_mean
  strict_filename_match: false
experiment:
  name: s2b_qs_2900_derivative_d1
  output_root: runs
  seed: 42
model:
  logreg_c: 1.0
  logreg_max_iter: 3000
  model_family: logreg
preprocess:
  baseline_lam: 100000.0
  baseline_method: airpls
  baseline_niter: 12
  baseline_p: 0.01
  normalization: snv
  savgol_poly: 3
  savgol_window: 11
  wn_max: 3285.0
  wn_min: 2460.0
  despike_enabled: false
  despike_threshold: 8.0
  despike_window: 5
  despike_max_iter: 1
  baseline_use_pybaselines: true
  baseline_morph_window: 51
  baseline_snip_max_half_window: 40
  derivative_order: 1
  outlier_filter: none
  outlier_z_threshold: 4.5
  outlier_min_keep: 12
  outlier_min_per_class: 2
validation:
  local_holdout_groups: []
  n_splits: 5
  split_kind: group_kfold
  split_seed: 42
  split_shuffle: false
