experiment:
  name: w2_1500_file_mean_arpls_emsc_svm
  seed: 42
  output_root: runs
data:
  root_dir: data/real
  center: '1500'
  sample_level: file_mean
  point_max_per_file: 40
  exclude_average: true
  exclude_anomaly_mismatch_center: true
  strict_filename_match: false
  require_all_classes: true
  allowed_classes:
  - control
  - endo
  - exo
preprocess:
  wn_min: 930.0
  wn_max: 1998.0
  baseline_method: arpls
  baseline_lam: 100000.0
  baseline_p: 0.01
  baseline_niter: 15
  savgol_window: 11
  savgol_poly: 3
  normalization: emsc
model:
  model_family: svm_rbf
  loss_function: MultiClass
  eval_metric: TotalF1
  iterations: 400
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0
  logreg_c: 1.0
  logreg_max_iter: 2000
  svm_c: 1.0
  svm_gamma: scale
  verbose: false
validation:
  n_splits: 5
  local_holdout_groups: []
