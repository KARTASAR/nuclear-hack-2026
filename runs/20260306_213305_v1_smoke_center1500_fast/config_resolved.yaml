experiment:
  name: v1_smoke_center1500_fast
  seed: 42
  output_root: runs
data:
  root_dir: data/real
  center: '1500'
  sample_level: file_mean
  point_max_per_file: 20
  dataset_cache_enabled: true
  dataset_cache_dir: .cache/raman_hack
  exclude_average: true
  exclude_anomaly_mismatch_center: true
  strict_filename_match: false
  require_all_classes: true
  allowed_classes:
  - control
  - endo
  - exo
preprocess:
  wn_min: 930.0
  wn_max: 1998.0
  baseline_method: none
  baseline_lam: 100000.0
  baseline_p: 0.01
  baseline_niter: 5
  baseline_use_pybaselines: true
  baseline_morph_window: 51
  baseline_snip_max_half_window: 40
  despike_enabled: false
  despike_threshold: 8.0
  despike_window: 5
  despike_max_iter: 1
  savgol_window: 9
  savgol_poly: 2
  derivative_order: 0
  normalization: snv
  outlier_filter: none
  outlier_z_threshold: 4.5
  outlier_min_keep: 12
  outlier_min_per_class: 2
model:
  model_family: catboost
  loss_function: MultiClass
  eval_metric: TotalF1
  iterations: 60
  learning_rate: 0.1
  depth: 5
  l2_leaf_reg: 3.0
  logreg_c: 1.0
  logreg_max_iter: 2000
  svm_c: 1.0
  svm_gamma: scale
  thread_count: 4
  verbose: false
  torch_epochs: 40
  torch_batch_size: 64
  torch_lr: 0.001
  torch_weight_decay: 0.0001
  torch_patience: 8
  torch_device: auto
  resnet_base_ch: 32
  resnet_blocks:
  - 2
  - 2
  - 2
  resnet_dropout: 0.1
  ramannet_segments: 64
  ramannet_embed_dim: 64
  ramannet_dropout: 0.1
  transformer_patch_size: 16
  transformer_d_model: 128
  transformer_nhead: 4
  transformer_num_layers: 3
  transformer_dim_ff: 256
  transformer_dropout: 0.1
  inception_base_ch: 32
  inception_dropout: 0.1
  drsn_base_ch: 32
  drsn_blocks:
  - 2
  - 2
  - 2
  efficientnet_width_mult: 1.0
  efficientnet_dropout: 0.2
  single_step_preproc_channels: 32
  single_step_preproc_blocks: 3
  single_step_unet_base_ch: 16
  single_step_head: ramannet
  single_step_head_dropout: 0.1
validation:
  n_splits: 3
  split_kind: group_kfold
  split_shuffle: false
  split_seed: 42
  local_holdout_groups: []
