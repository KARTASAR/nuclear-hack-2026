experiment:
  name: v1_point_center1500
  seed: 42
  output_root: runs

data:
  root_dir: data/real
  center: "1500"
  sample_level: point
  point_max_per_file: 25
  exclude_average: true
  exclude_anomaly_mismatch_center: true
  allowed_classes: [control, endo, exo]

preprocess:
  wn_min: 930.0
  wn_max: 1998.0
  baseline_method: arpls
  baseline_lam: 100000.0
  baseline_p: 0.01
  baseline_niter: 15
  savgol_window: 11
  savgol_poly: 3
  normalization: snv

model:
  model_family: catboost
  loss_function: MultiClass
  eval_metric: TotalF1
  iterations: 300
  learning_rate: 0.05
  depth: 6
  l2_leaf_reg: 3.0
  verbose: false

validation:
  n_splits: 5
