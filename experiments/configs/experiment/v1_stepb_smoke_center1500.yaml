experiment:
  name: v1_stepb_smoke_center1500
  seed: 42
  output_root: runs

data:
  root_dir: data/real
  center: "1500"
  sample_level: file_mean
  point_max_per_file: 30
  dataset_cache_enabled: true
  dataset_cache_dir: .cache/raman_hack
  exclude_average: true
  exclude_anomaly_mismatch_center: true
  allowed_classes: [control, endo, exo]

preprocess:
  wn_min: 930.0
  wn_max: 1998.0
  despike_enabled: true
  despike_threshold: 8.0
  despike_window: 5
  despike_max_iter: 1
  baseline_method: snip               # none | als | asls | airpls | arpls | snip | morph
  baseline_use_pybaselines: true
  baseline_lam: 100000.0
  baseline_p: 0.01
  baseline_niter: 12
  baseline_snip_max_half_window: 40
  baseline_morph_window: 51
  savgol_window: 11
  savgol_poly: 3
  derivative_order: 1                  # 0 | 1 | 2
  normalization: snv                   # none | minmax | snv | msc | emsc
  outlier_filter: mad                  # none | mad
  outlier_z_threshold: 4.5
  outlier_min_keep: 12
  outlier_min_per_class: 2

model:
  model_family: catboost
  loss_function: MultiClass
  eval_metric: TotalF1
  thread_count: 4
  iterations: 250
  learning_rate: 0.06
  depth: 6
  l2_leaf_reg: 3.0
  verbose: false

validation:
  n_splits: 5
